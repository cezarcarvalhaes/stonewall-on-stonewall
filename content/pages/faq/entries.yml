entries:
  - question: Where does Stonewall on Stonewall take place?
    answer: At the intersection of **W 28th & Stonewall Ave**. The parade runs along
      Stonewall Ave from W 28th to W 34th and back.
  - question: When is it?
    answer: "**Sunday, June 28, 2026, from 4:00–7PM.** The parade steps off at
      5:00PM, and screenprinting starts at 4:00PM."
  - question: How much does it cost?
    answer: It's **free** and open to everyone. Bring your neighbors!
  - question: Can I bring my kids and pets?
    answer: Absolutely. This is a family-friendly neighborhood event. Please keep
      pets leashed and clean up after them.
  - question: How do I join the parade?
    answer: Just show up at W 28th & Stonewall by 5:00PM. Decorate your bike,
      stroller, wagon, or yourself — the more festive, the better!
  - question: Where should I park?
    answer: >-
      This is a pedestrian and bike focused event. If you are coming from
      somewhere not walkable or rideable, please consider taking the FREE GRTC
      bus, and stop at 28th and Semmes. Plan your trip
      with <https://ridegrtc.com/planning-your-trip/trip-planner/>


      Another option is to take [RVA Bikes ](https://rvabikes.com/map)- there is a convenient docking location in Carter Jones Park.\

      \

      If you must drive, please avoid Stonewall Ave as well as W 28th street where the gathering and parades take place.
  - question: Is the event accessible?
    answer: The parade follows public sidewalks and streets. If you have specific
      accessibility needs, [reach out](mailto:stonewallonstonewall@gmail.com)
      and we'll do our best to help.
  - question: What happens if it rains?
    answer: Stonewall on Stonewall happens rain or shine. Check this site or our
      social channels for any weather updates.
  - question: Will restrooms be available?
    answer: Yes! ADA-accessible porta-potties are provided courtesy of Council
      Member Stephanie Lynch's office.
  - question: What if I'm out of town?
    answer: We'll miss you! Decorate your home and yard to spread cheer and
      solidarity to everyone walking the parade route.
  - question: How can I help?
    answer: We'd love that! See the [Get Involved](/#get-involved) section or [email
      us](mailto:stonewallonstonewall@gmail.com) to volunteer.
