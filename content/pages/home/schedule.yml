title: Schedule of Events
entries:
  - time: 4:00 PM
    title: Screen Printing Begins
    description: "Free screen printing with StudioTwoThree from 4–5pm. Bring any
      shirts, flags, fabrics, or paper you'd like to print on! Check out the
      screenprinting design options:
      https://docs.google.com/presentation/d/1Ij1bAL7H7IRQjLCy-kVXxcBkDh3dMpkuC\
      2Pd4yg59jc/present?slide=id.g3d8a0b56be4_0_0"
  - time: 4:30 PM
    title: Event Kicks Off
    description: Delegate Rae Cousins kicks off "Stonewall on Stonewall" at the
      gathering space, W 28th + Stonewall.
  - time: 4:40 PM
    title: Remarks & Remembrance
    description: Remarks from Lieutenant Governor Ghazala Hashmi, and a moment of
      remembrance for Bill Martin, Vickie Hester, Beth Marschak, and the other
      warriors who came before us.
  - time: 4:50 PM
    title: Practice Parade Chants
    description: "Warm up your voice and learn the chants before we march. Check out
      the chants here:
      https://docs.google.com/presentation/d/1kesNJ6gUt-uoxRAesJ_FVI5wcYNBkd-qU\
      Gaadvd7cBA/present?slide=id.g33d37a822e4_0_0"
  - time: 4:55 PM
    title: Parade Lineup
    description: Directions for parade lineup with Jaycie Cuprill and more.
  - time: 5:00 PM
    title: Everyone Parades!
    description: March up Stonewall Ave from W 28th to W 34th and back. Decorate
      your bikes, strollers, and floats!
  - time: 5:45 PM
    title: The Disco Cat Welcomes Us Back
    description: DJ The Disco Cat welcomes the parade back to the gathering space.
  - time: 6:00 PM
    title: Council Member Kenya Gibson
    description: Remarks from the Honorable Kenya Gibson, Richmond City Council.
  - time: 6:30 PM
    title: Deau Eyes Performs
    description: Live music from Deau Eyes.
  - time: 7:00 PM
    title: Closing Remarks
    description: Closing remarks and next steps in the charge with the Honorable
      Stephanie Lynch and Sarah Abubaker, Richmond City Council.
